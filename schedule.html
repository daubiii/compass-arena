<link rel="preload" href="/fonts/onest-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>

<style>
.page-hero { position: relative; padding: calc(var(--head-h) + 88px) 0 48px; overflow: hidden; }
.page-hero::before { content: ''; position: absolute; inset: 0; background: url('/img/hero.webp') 82% 30% / cover no-repeat; opacity: .5; }
.page-hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, var(--bg) 8%, rgba(7,8,10,.55) 60%, rgba(7,8,10,.85) 100%), linear-gradient(0deg, var(--bg) 0%, rgba(7,8,10,0) 60%); }
.page-hero .wrap { position: relative; z-index: 1; }
.page-hero h1 { font-family: var(--display); font-weight: 300; font-size: clamp(34px, 5vw, 64px); line-height: 1.06; letter-spacing: -.025em; margin-bottom: 20px; }

.sched { padding: 8px 0 110px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 44px; position: sticky; top: calc(var(--head-h) + 8px); z-index: 20; padding: 8px 0; }
.chip-f { height: 38px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line-2); background: rgba(7,8,10,.7); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: var(--text-2); font-size: 14px; cursor: pointer; transition: color .2s, background .2s, border-color .2s; }
.chip-f:hover { color: var(--text); border-color: rgba(255,255,255,.3); }
.chip-f.active { background: var(--text); color: #0b0c0e; border-color: var(--text); }

.day { margin-bottom: 52px; }
.day-title { font-family: var(--display); font-weight: 300; font-size: clamp(20px, 2.4vw, 28px); margin-bottom: 18px; }
.day-title small { font-family: var(--ui); font-size: 14px; color: var(--text-3); margin-left: 12px; text-transform: none; }

.s-list { border-top: 1px solid var(--line); }
.s-row { display: grid; grid-template-columns: 110px 1fr auto; gap: 8px 28px; align-items: center; padding: 22px 4px; border-bottom: 1px solid var(--line); position: relative; transition: background .25s; }
.s-row:hover { background: rgba(255,255,255,.02); }
.s-when { font-family: var(--display); font-weight: 400; font-size: 18px; color: var(--gold-hi); font-variant-numeric: tabular-nums; }
.s-when.tbd { font-family: var(--ui); font-size: 14px; color: var(--text-3); }
.s-teams { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 18px; }
.s-teams .vs { color: var(--text-3); font-size: 12px; }
.s-teams .win { color: var(--gold-hi); }
.s-teams .lose { color: var(--text-3); }
.s-teams .tbd { color: var(--text-3); }
.s-teams .sc { font-family: var(--display); font-weight: 400; font-size: 16px; color: var(--gold-hi); font-variant-numeric: tabular-nums; }
.s-tag { font-size: 13px; color: var(--text-3); white-space: nowrap; }
.s-tag.grand { color: var(--gold); }
.s-live { display: inline-flex; align-items: center; gap: 8px; color: var(--blood); }
.s-row.is-live { background: linear-gradient(90deg, rgba(194,88,76,.09), transparent 60%); }
.s-row.is-live::before { content: ''; position: absolute; left: 0; top: 14px; bottom: 14px; width: 2px; background: var(--blood); border-radius: 2px; }
.s-row.done .s-when { color: var(--text-3); }
.empty { padding: 64px 0; color: var(--text-3); text-align: center; }

@media (max-width: 820px) {
  .page-hero { padding-top: calc(var(--head-h) + 56px); }
  .filters { flex-wrap: nowrap; overflow-x: auto; margin: 0 -20px 32px; padding: 8px 20px; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .chip-f { flex: none; }
  .day-title small { display: block; margin: 6px 0 0; }
  .s-row { grid-template-columns: 1fr; gap: 8px; padding: 18px 2px; }
  .s-when { display: flex; align-items: baseline; gap: 12px; }
  .s-teams { font-size: 16px; }
}
</style>
</head>
<body>

<header class="site-head" id="head">
  <div class="wrap head-row">
    <a class="brand" href="/" aria-label="Compass Arena — на главную">
      <img src="/img/mark.webp" width="30" height="30" alt="">
      <span>Compass <i>Arena</i></span>
    </a>
    <nav class="head-nav" aria-label="Основная навигация">
      <a href="/#bracket">Сетка</a>
      <a href="/schedule.html" aria-current="page">Расписание</a>
      <a href="/rules.html">Правила</a>
      <a class="pill" href="https://www.twitch.tv/compassarena" target="_blank" rel="noopener">Смотреть</a>
    </nav>
    <button class="burger" id="burgerBtn" aria-label="Открыть меню" aria-expanded="false"><span></span><span></span><span></span></button>
  </div>
</header>
<nav class="menu" id="menuPanel" aria-label="Меню">
  <a href="/">Главная</a>
  <a href="/#bracket">Сетка</a>
  <a href="/schedule.html">Расписание</a>
  <a href="/rules.html">Правила</a>
  <a href="https://www.twitch.tv/compassarena" target="_blank" rel="noopener">Twitch</a>
</nav>

<main>
  <section class="page-hero">
    <div class="wrap">
      <p class="kicker">Все матчи — Bo3</p>
      <h1>Расписание матчей</h1>
      <p class="lead">Время указано в вашем часовом поясе<span id="tzNote"></span>.</p>
    </div>
  </section>

  <section class="sched">
    <div class="wrap">
      <div class="filters" id="filters" role="tablist" aria-label="Фильтр матчей">
        <button class="chip-f active" data-filter="all">Все матчи</button>
        <button class="chip-f" data-filter="r1">Раунд 1</button>
        <button class="chip-f" data-filter="semi">Полуфинал</button>
        <button class="chip-f" data-filter="grand">Гранд-финал</button>
        <button class="chip-f" data-filter="done">Сыгранные</button>
      </div>
      <div id="scheduleList"><div class="empty">Загрузка</div></div>
    </div>
  </section>
</main>

<footer class="site-foot">
  <div class="wrap foot-row">
    <span>Compass Arena — организатор турниров по Dota 2</span>
    <div class="foot-links">
      <a href="/">Главная</a>
      <a href="/rules.html">Правила</a>
      <a href="https://www.twitch.tv/compassarena" target="_blank" rel="noopener">Twitch</a>
      <a href="https://t.me/compassarenaa" target="_blank" rel="noopener">Telegram</a>
    </div>
  </div>
</footer>

<button class="to-top" id="toTop" aria-label="Наверх"><svg viewBox="0 0 16 16" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l5-5 5 5"/></svg></button>
<script src="/site.js"></script>
<script>
var DATA = { teams: [], matches: [], schedule: {}, liveMatchId: null };
var CURRENT_FILTER = 'all';

function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
}

function loadData() {
    return fetch('/api/data', { cache: 'no-store' })
        .then(function (res) { if (!res.ok) throw new Error('bad response'); return res.json(); })
        .then(function (parsed) {
            if (parsed.teams) DATA.teams = parsed.teams;
            if (parsed.matches) DATA.matches = parsed.matches;
            if (parsed.schedule) DATA.schedule = parsed.schedule;
            DATA.liveMatchId = parsed.liveMatchId != null ? parsed.liveMatchId : null;
        })
        .catch(function (err) { console.warn('Не удалось загрузить данные', err); });
}

function getMatch(id) {
    for (var i = 0; i < DATA.matches.length; i++) if (DATA.matches[i].id === id) return DATA.matches[i];
    return null;
}
function teamName(id) {
    for (var i = 0; i < DATA.teams.length; i++) if (DATA.teams[i].id === id) return DATA.teams[i].name;
    return null;
}

// Пары, которые ещё не определены — подсказываем, откуда они придут
var TBD = { 4: ['Победитель M1', 'Победитель M2'], 5: ['Победитель M4', 'Победитель M3'] };

function slotName(m, slot) {
    var n = teamName(slot === 1 ? m.team1 : m.team2);
    if (n) return { text: n, known: true };
    var t = TBD[m.id];
    return { text: t ? t[slot - 1] : 'Ожидается', known: false };
}

function stage(m) {
    if (m.bracket === 'grand' || m.id === 5) return { key: 'grand', label: 'Гранд-финал' };
    if (m.round === 2 || m.id === 4) return { key: 'semi', label: 'Полуфинал' };
    return { key: 'r1', label: 'Раунд 1' };
}

function timeParts(dt) {
    var d = new Date(dt);
    if (isNaN(d.getTime())) return null;
    return {
        ts: d.getTime(),
        time: d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }),
        key: (function (k) { return k.charAt(0).toUpperCase() + k.slice(1); })(d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', weekday: 'long' }))
    };
}

function render() {
    var box = document.getElementById('scheduleList');
    var list = [];
    for (var i = 0; i < DATA.matches.length; i++) {
        var m = DATA.matches[i];
        var t = DATA.schedule[m.id] ? timeParts(DATA.schedule[m.id]) : null;
        var bothKnown = !!(m.team1 && m.team2);
        // Показываем матч, если известны обе команды ИЛИ уже назначено время
        if (!bothKnown && !t) continue;

        var st = stage(m);
        if (CURRENT_FILTER === 'done') { if (!m.winner) continue; }
        else if (CURRENT_FILTER !== 'all' && st.key !== CURRENT_FILTER) continue;

        list.push({ m: m, t: t, st: st });
    }

    if (!list.length) { box.innerHTML = '<div class="empty">Матчей по этому фильтру пока нет</div>'; return; }

    list.sort(function (a, b) {
        var ta = a.t ? a.t.ts : 9e15, tb = b.t ? b.t.ts : 9e15;
        return ta - tb || a.m.id - b.m.id;
    });

    var groups = [], idx = {};
    list.forEach(function (it) {
        var key = it.t ? it.t.key : 'Дата уточняется';
        if (!(key in idx)) { idx[key] = groups.length; groups.push({ key: key, items: [] }); }
        groups[idx[key]].items.push(it);
    });

    var html = '';
    groups.forEach(function (g) {
        html += '<div class="day reveal in"><h2 class="day-title">' + esc(g.key) + '<small>' + g.items.length + ' ' + (g.items.length === 1 ? 'матч' : (g.items.length < 5 ? 'матча' : 'матчей')) + '</small></h2><div class="s-list">';
        g.items.forEach(function (it) {
            var m = it.m, has = m.score1 != null && m.score2 != null, live = DATA.liveMatchId === m.id;
            var a = slotName(m, 1), b = slotName(m, 2);
            var ca = m.winner ? (m.winner === m.team1 ? 'win' : 'lose') : (a.known ? '' : 'tbd');
            var cb = m.winner ? (m.winner === m.team2 ? 'win' : 'lose') : (b.known ? '' : 'tbd');
            html += '<div class="s-row' + (live ? ' is-live' : '') + (m.winner ? ' done' : '') + '">';
            html += it.t ? '<div class="s-when">' + it.t.time + '</div>' : '<div class="s-when tbd">Время уточняется</div>';
            html += '<div class="s-teams"><span class="' + ca + '">' + esc(a.text) + '</span>' +
                    (has ? '<span class="sc">' + m.score1 + ':' + m.score2 + '</span>' : '<span class="vs">против</span>') +
                    '<span class="' + cb + '">' + esc(b.text) + '</span></div>';
            html += '<div class="s-tag ' + (it.st.key === 'grand' ? 'grand' : '') + '">' +
                    (live ? '<span class="s-live"><span class="live-dot"></span>В эфире</span>' : (m.winner ? 'Сыгран · ' + it.st.label : it.st.label)) + '</div>';
            html += '</div>';
        });
        html += '</div></div>';
    });
    box.innerHTML = html;
}

document.getElementById('filters').addEventListener('click', function (e) {
    var btn = e.target.closest('.chip-f');
    if (!btn) return;
    this.querySelectorAll('.chip-f').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
    CURRENT_FILTER = btn.dataset.filter;
    render();
});

// подпись часового пояса зрителя
(function () {
    try {
        var tz = new Date().toLocaleTimeString('ru-RU', { timeZoneName: 'short' }).split(' ').pop().replace('GMT+3', 'МСК');
        if (tz) document.getElementById('tzNote').textContent = ' (' + tz + ')';
    } catch (e) {}
})();

document.addEventListener('DOMContentLoaded', function () {
    loadData().then(render);
    setInterval(function () { loadData().then(render); }, 60000);
});
</script>
</body>
</html>
