# ============================================================
# Compass Arena Bot — Cloudflare Worker + D1
# ------------------------------------------------------------
# Здесь только публичные значения: имя воркера, точка входа,
# версия совместимости, привязка базы D1 и ENVIRONMENT.
#
# СЕКРЕТОВ В ЭТОМ ФАЙЛЕ БЫТЬ НЕ ДОЛЖНО.
# BOT_TOKEN, ADMIN_ID и WEBHOOK_SECRET задаются командами:
#   npx wrangler secret put BOT_TOKEN
#   npx wrangler secret put ADMIN_ID
#   npx wrangler secret put WEBHOOK_SECRET
# ============================================================

name = "compass-arena-bot"
main = "src/index.js"
compatibility_date = "2025-09-23"
# Нужен для работы с бинарными данными логотипов (base64/буферы)
compatibility_flags = ["nodejs_compat"]

# Логи и трейсы в панели Cloudflare (публичная настройка, не секрет)
[observability]
enabled = true

# ------------------------------------------------------------
# База D1. binding = DB (в коде — env.DB)
# database_id подставляется после `wrangler d1 create compass-arena-bot`
# ------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "compass-arena-bot"
database_id = "84c681ea-ea0c-4a6f-8fb9-91b73cb2d481"

# ------------------------------------------------------------
# Публичные переменные окружения
# ------------------------------------------------------------
[vars]
BOT_USERNAME = "CompassArenaReg_bot"
# В проде воркер без WEBHOOK_SECRET отказывается работать (500).
# Для локальной разработки переопределяется в bot/.dev.vars: ENVIRONMENT=development
ENVIRONMENT = "production"
# --- Сезон 2: оплата участия и доступные дисциплины ---
# Дисциплины, на которые сейчас идёт набор (остальные в боте серые и недоступны). По умолчанию — только CS:GO.
# ENABLED_DISCIPLINES = "csgo"
# Сумма взноса и реквизиты показываются сразу после регистрации команды. Можно писать в несколько строк.
# Пока PAY_REQUISITES пуст, бот просит писать организаторам за реквизитами.
# PAY_AMOUNT = "1000 ₽"
# PAY_REQUISITES = "Сбербанк · +7 900 000-00-00 · Имя Ф."
# Остальные параметры (лимит заявок, размер логотипа) имеют значения
# по умолчанию в коде: 300 секунд и 200 КБ.
